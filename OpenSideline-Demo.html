<body>
  <div id="app"></div>
  <script type="module">
/**
 * OpenSideline baseball scoring engine, v0.1.
 * Immutable game event journal + pure replay. The domain package has no UI dependencies.
 *
 * Scope: standard pitch counts, basic PA outcomes, deterministic one/two/three-base
 * hit advancement, forced walks, simple outs, steals and manual runner movement.
 * Complex scorer's decisions are deliberately excluded until rules are modeled.
 */
export const ENGINE_VERSION = '0.1.0';
export const PLAY_RESULTS = Object.freeze({
  SINGLE: 'Single', DOUBLE: 'Double', TRIPLE: 'Triple', HOME_RUN: 'Home run',
  OUT: 'Out in play', ERROR: 'Reached on error', SAC_FLY: 'Sacrifice fly',
});
const EVENT_TYPES = new Set(['BALL', 'STRIKE', 'FOUL', 'BALL_IN_PLAY', 'WALK', 'HBP', 'STOLEN_BASE', 'ADVANCE_RUNNER', 'RUNNER_OUT']);
const STATS = () => ({ PA: 0, AB: 0, H: 0, R: 0, RBI: 0, BB: 0, SO: 0, HBP: 0, doubles: 0, triples: 0, HR: 0, SF: 0, SB: 0, CS: 0 });
const assert = (condition, text) => { if (!condition) throw new Error(text); };
const sanitize = (str, max = 50) => String(str ?? '').trim().slice(0, max);
const defaultRoster = (prefix) => Array.from({ length: 9 }, (_, i) => ({ id: `${prefix}-${i + 1}`, number: String(i + 1), name: `Player ${i + 1}` }));

function validateRoster(roster, prefix) {
  assert(Array.isArray(roster) && roster.length >= 1 && roster.length <= 30, 'Each roster needs 1–30 players.');
  const ids = new Set();
  return roster.map((p, i) => {
    const name = sanitize(p?.name, 60);
    assert(name.length > 0, `Player ${i + 1} needs a name.`);
    const id = sanitize(p?.id || `${prefix}-${i + 1}`, 80);
    assert(!ids.has(id), 'Each player needs a unique ID on their team.');
    ids.add(id);
    return { id, number: sanitize(p?.number, 5), name };
  });
}

export function createGame({ homeName = 'Home Hawks', awayName = 'Visiting Tigers', homeRoster, awayRoster } = {}) {
  const nameHome = sanitize(homeName, 60), nameAway = sanitize(awayName, 60);
  assert(nameHome && nameAway, 'Both teams need names.');
  return {
    schemaVersion: 1, engineVersion: ENGINE_VERSION,
    id: `game-${Date.now().toString(36)}`,
    createdAt: new Date().toISOString(),
    teams: {
      home: { name: nameHome, roster: validateRoster(homeRoster ?? defaultRoster('home'), 'home') },
      away: { name: nameAway, roster: validateRoster(awayRoster ?? defaultRoster('away'), 'away') },
    },
    events: [],
  };
}

function freshView(game) {
  return {
    inning: 1, half: 'top', outs: 0, balls: 0, strikes: 0,
    bases: { 1: null, 2: null, 3: null },
    scores: { home: 0, away: 0 }, hits: { home: 0, away: 0 }, errors: { home: 0, away: 0 },
    lineScore: { home: {}, away: {} },
    battingIndex: { home: 0, away: 0 },
    playerStats: {
      home: Object.fromEntries(game.teams.home.roster.map(p => [p.id, STATS()])),
      away: Object.fromEntries(game.teams.away.roster.map(p => [p.id, STATS()])),

    playLog: [], eventCount: 0,
  };
}
const battingSide = (s) => s.half === 'top' ? 'away' : 'home';
const fieldingSide = (s) => s.half === 'top' ? 'home' : 'away';
const batterOf = (s, game) => {
  const side = battingSide(s), roster = game.teams[side].roster;
  return roster[s.battingIndex[side] % roster.length];
};
function addRun(s, runner, rbiBatter = null) {
  const side = battingSide(s);
  s.scores[side] += 1;
  s.lineScore[side][s.inning] = (s.lineScore[side][s.inning] ?? 0) + 1;
  s.playerStats[side][runner.id].R += 1;
  if (rbiBatter) s.playerStats[side][rbiBatter.id].RBI += 1;
}
function finishPA(s, game, { hit = null, ab = false, walk = false, strikeout = false, hbp = false, sf = false } = {}) {
  const side = battingSide(s), batter = batterOf(s, game), st = s.playerStats[side][batter.id];
  st.PA++; if (ab) st.AB++; if (walk) st.BB++; if (strikeout) st.SO++;
  if (hbp) st.HBP++; if (sf) st.SF++;
  if (hit) {
    st.H++; s.hits[side]++;
    if (hit === 'DOUBLE') st.doubles++;
    if (hit === 'TRIPLE') st.triples++;
    if (hit === 'HOME_RUN') st.HR++;
  }
  s.battingIndex[side]++;
  s.balls = 0; s.strikes = 0;
}
function endHalfIfNeeded(s) {
  if (s.outs !== 3) return false;
  s.outs = 0; s.balls = 0; s.strikes = 0;
  s.bases = { 1: null, 2: null, 3: null };
  if (s.half === 'top') s.half = 'bottom';
  else { s.half = 'top'; s.inning++; }
  return true;
}
function forceFirst(s, batter, grantRbi) {
  const b1 = s.bases[1], b2 = s.bases[2], b3 = s.bases[3];
  if (b1 && b2 && b3) addRun(s, b3, grantRbi ? batter : null);
  if (b1 && b2) s.bases[3] = b2;
  if (b1) s.bases[2] = b1;
  s.bases[1] = batter;
}
function moveOnHit(s, batter, bases) {
  const existing = { ...s.bases }, next = { 1: null, 2: null, 3: null };
  for (let from = 3; from >= 1; from--) {
    const runner = existing[from];
    if (!runner) continue;
    const to = from + bases;
    if (to >= 4) addRun(s, runner, batter);
    else next[to] = runner;
  }
  if (bases === 4) addRun(s, batter, batter);
  else next[bases] = batter;
  s.bases = next;
}
function addLog(s, event, label, prior, game) {
  s.playLog.push({
    index: s.eventCount + 1, at: event.at || '',
    inning: prior.inning, half: prior.half,
    offense: prior.half === 'top' ? game.teams.away.name : game.teams.home.name,
    label,
  });
}
function process(s, game, event) {
  assert(event && EVENT_TYPES.has(event.type), 'Unknown scoring action.');
  const prev = { inning: s.inning, half: s.half };
  const batter = batterOf(s, game);
  const team = battingSide(s), defense = fieldingSide(s);
  let label = '';
  switch (event.type) {
    case 'BALL':
      s.balls++;
      if (s.balls === 4) {
        forceFirst(s, batter, true);
        finishPA(s, game, { walk: true });
        label = `${batter.name} walks (four balls)`;
      } else label = `Ball • ${s.balls}-${s.strikes}`;
      break;
    case 'STRIKE':
      s.strikes++;
      if (s.strikes === 3) {
        finishPA(s, game, { ab: true, strikeout: true });
        s.outs++; label = `${batter.name} strikes out`;
        endHalfIfNeeded(s);
      } else label = `Strike • ${s.balls}-${s.strikes}`;
      break;
    case 'FOUL':
      if (s.strikes < 2) s.strikes++;
      label = `Foul • ${s.balls}-${s.strikes}`;
      break;
    case 'WALK':
      forceFirst(s, batter, true);
      finishPA(s, game, { walk: true });
      label = `${batter.name} walks`;
      break;
    case 'HBP':
      forceFirst(s, batter, true);
      finishPA(s, game, { hbp: true });
      label = `${batter.name} hit by pitch`;
      break;
    case 'BALL_IN_PLAY': {
      const result = event.result;
      assert(Object.prototype.hasOwnProperty.call(PLAY_RESULTS, result), 'Unknown ball-in-play result.');
      if (['SINGLE', 'DOUBLE', 'TRIPLE', 'HOME_RUN'].includes(result)) {
        const bases = { SINGLE: 1, DOUBLE: 2, TRIPLE: 3, HOME_RUN: 4 }[result];
        moveOnHit(s, batter, bases);
        finishPA(s, game, { ab: true, hit: result });
        label = `${batter.name} • ${PLAY_RESULTS[result]}`;
      } else if (result === 'ERROR') {
        forceFirst(s, batter, false);
        s.errors[defense]++;
        finishPA(s, game, { ab: true });
        label = `${batter.name} reaches on error`;
      } else if (result === 'SAC_FLY') {
        assert(s.outs < 2, 'A sacrifice fly requires fewer than two outs.');
        assert(s.bases[3], 'A sacrifice fly requires a runner on third.');
        addRun(s, s.bases[3], batter); s.bases[3] = null;
        finishPA(s, game, { sf: true });
        s.outs++; label = `${batter.name} • sacrifice fly (1 RBI)`;
        endHalfIfNeeded(s);
      } else {
        finishPA(s, game, { ab: true });
        s.outs++; label = `${batter.name} • out in play`;
        endHalfIfNeeded(s);
      }
      break;
    }
    case 'STOLEN_BASE':
    case 'ADVANCE_RUNNER': {
      const from = Number(event.from);
      assert([1, 2, 3].includes(from), 'Choose a valid occupied base.');
      assert(s.bases[from], 'No runner on that base.');
      const runner = s.bases[from];
      const to = from + 1;
      assert(to === 4 || !s.bases[to], 'Next base is already occupied.');
      s.bases[from] = null;
      if (to === 4) addRun(s, runner);
      else s.bases[to] = runner;
      if (event.type === 'STOLEN_BASE') s.playerStats[team][runner.id].SB++;
      label = `${runner.name} ${event.type === 'STOLEN_BASE' ? 'steals' : 'advances to'} ${to === 4 ? 'home' : `${['', 'first', 'second', 'third'][to]} base`}`;
      break;
    }
    case 'RUNNER_OUT': {
      const from = Number(event.from);
      assert([1, 2, 3].includes(from) && s.bases[from], 'Choose an occupied base.');
      const runner = s.bases[from];
      s.bases[from] = null; s.outs++;
      if (event.caughtStealing) s.playerStats[team][runner.id].CS++;
      label = `${runner.name} out on bases${event.caughtStealing ? ' (caught stealing)' : ''}`;
      endHalfIfNeeded(s);
      break;
    }
  }
  addLog(s, event, label, prev, game);
  s.eventCount++;
  return s;
}

export function replayGame(game) {
  assert(game && game.schemaVersion === 1 && game.teams && Array.isArray(game.events), 'Invalid or unsupported game file.');
  // Incomplete/invalid external data must not be trusted simply because it parses as JSON.
  const validated = {
    teams: {
      home: { name: sanitize(game.teams.home?.name, 60), roster: validateRoster(game.teams.home?.roster, 'home') },
      away: { name: sanitize(game.teams.away?.name, 60), roster: validateRoster(game.teams.away?.roster, 'away') },
    },
  };
  assert(game.events.length <= 10000, 'Game has too many events.');
  const state = freshView(validated);
  for (const event of game.events) process(state, validated, event);
  state.batter = batterOf(state, validated);
  state.batting = battingSide(state);
  state.fielding = fieldingSide(state);
  return state;
}
export function appendEvent(game, event) {
  const next = { ...game, events: [...game.events, { ...event }] };
  replayGame(next); // validation before accepting the new event
  return next;
}
export function undoEvent(game) {
  return { ...game, events: game.events.slice(0, -1) };
}
export function formatAvg(h, ab) { return ab ? (h / ab).toFixed(3).replace(/^0/, '') : '.000'; }
export function formatObp(st) {
  const denominator = st.AB + st.BB + st.HBP + st.SF;
  return denominator ? ((st.H + st.BB + st.HBP) / denominator).toFixed(3).replace(/^0/, '') : '.000';
}
export function formatSlg(st) {
  return st.AB ? ((st.H + st.doubles + 2 * st.triples + 3 * st.HR) / st.AB).toFixed(3).replace(/^0/, '') : '.000';
}

      <div class="work-grid"><section class="card play-card"><div class="card-top"><div class="section-label">AT BAT</div><span class="pill">${safe(game.teams[v.batting].name)}</span></div>
        <div class="batter-block"><div class="batter-avatar">${safe(batter.number || '—')}</div><div><div class="batter-title">${safe(batter.name)}</div><div class="batter-sub">${safe(game.teams[v.batting].name)} · Batting #${(v.battingIndex[v.batting] % game.teams[v.batting].roster.length) + 1}</div></div></div>
        <div class="field-wrap"><div class="field-label">ON THE BASES</div>${renderBases(v,true)}<div class="base-key"><span class="key-dot"></span> Occupied base</div></div>
        <div class="control-wrap">${playActions(v)}</div>
      </section>
      <section class="card timeline-card"><div class="timeline-header"><div><div class="section-label">GAME DETAILS</div><h3>Follow the action</h3></div><span class="number-badge">${game.events.length}</span></div>
        <div class="tabs"><button class="${selectedTab === 'plays' ? 'active' : ''}" data-tab="plays">Play-by-play</button><button class="${selectedTab === 'stats' ? 'active' : ''}" data-tab="stats">Box score</button></div>
        <div class="tab-content">${selectedTab === 'plays' ? renderPlayLog(v) : renderStats(v)}</div>
        <div class="timeline-bottom"><div>${icon('info',16)} <span>Game data is saved in this browser only.</span></div><button data-command="export">Export game ${icon('arrow',15)}</button></div>
      </section></div>
      <div class="footer-note"><span>OpenSideline <b>v0.1</b> — Community-built sports technology</span><span>Prototype · Not a certified official scorebook</span></div>
    </div></main></div>`;
}
function renderSpectator(v) {
  const overlay = displayMode === 'overlay';
  return `<div class="${overlay ? 'overlay-mode' : 'spectator-mode'}"><div class="spectator-head"><div class="brand compact"><span class="brand-logo">${icon('baseball',25)}</span><div>Open<span>Sideline</span></div></div>${overlay ? '<span class="tag muted">OBS DEMO</span>' : '<span class="live-tag"><span class="green-dot"></span> LOCAL LIVE VIEW</span>'}</div>
  ${scoreHeader(v,true)}${overlay ? '' : `<section class="spectator-base"><div class="section-label">CURRENT SITUATION</div><div class="spectator-grid">${renderBases(v,true)}<div class="batter-now"><small>AT BAT</small><h2>${safe(v.batter.name)}</h2><span>${safe(game.teams[v.batting].name)}</span><p>${v.outs} out${v.outs === 1 ? '' : 's'} · ${v.balls}-${v.strikes} count</p></div></div></section><div class="spectator-updates"><h3>Recent plays</h3>${renderPlayLog(v)}</div>`}
  <div class="spectator-footer">${overlay ? 'Preview only — syncs across tabs in the same browser profile.' : 'OpenSideline prototype • Local-tab synchronization only; not an internet broadcast.'}</div>
  </div>`;
}
function parseRoster(raw, prefix) {
  const entries = String(raw).split('\n').map(x=>x.trim()).filter(Boolean);
  return entries.map((line,i) => {
    const m = line.match(/^#?(\d{1,3})\s*[-:.]?\s+(.+)$/);
    return { id: `${prefix}-${i+1}`, number: m ? m[1] : String(i+1), name: m ? m[2].trim() : line };
  });
}
function rosterToText(side) { return game.teams[side].roster.map(p => `#${p.number} ${p.name}`).join('\n'); }
function setupModal() {
  return `<div class="modal-backdrop" data-command="close-setup"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="setup-title"><div class="modal-head"><div><div class="eyebrow">GAME SETTINGS</div><h2 id="setup-title">Set up a game</h2><p>Enter players in batting order. One player per line: <b>#12 Jordan Smith</b>.</p></div><button data-command="close-setup" class="close-button" aria-label="Close setup">×</button></div>
    <form id="setup-form"><div class="setup-columns"><div><label for="away-name">Away team</label><input id="away-name" name="awayName" maxlength="60" value="${safe(game.teams.away.name)}" required/><label for="away-roster">Away roster</label><textarea id="away-roster" name="awayRoster" rows="10" required>${safe(rosterToText('away'))}</textarea></div>
    <div><label for="home-name">Home team</label><input id="home-name" name="homeName" maxlength="60" value="${safe(game.teams.home.name)}" required/><label for="home-roster">Home roster</label><textarea id="home-roster" name="homeRoster" rows="10" required>${safe(rosterToText('home'))}</textarea></div></div>
    <p class="warning-text">Saving setup starts a new game and clears the current plays. Export your game first if you want to keep a record.</p><div class="modal-footer"><button type="button" class="btn subtle" data-command="close-setup">Cancel</button><button class="btn primary" type="submit">Start new game ${icon('arrow',16)}</button></div></form></div></div>`;
}
function render() {
  const v = replayGame(game);
  document.title = `OpenSideline | ${game.teams.away.name} ${v.scores.away}–${v.scores.home} ${game.teams.home.name}`;
  app.innerHTML = (displayMode === 'scorer' ? renderScorer(v) : renderSpectator(v)) + (showSetup && displayMode === 'scorer' ? setupModal() : '') + (feedback ? `<div class="toast" role="status">${safe(feedback)}</div>` : '');
}
function perform(event) {
  try { commit(appendEvent(game, { ...event, at: new Date().toISOString() })); }
  catch(e) { toast(e.message || 'Could not record this play.'); }
}
function downloadGame() {
  const json = new Blob([JSON.stringify(game, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(json);
  const link = document.createElement('a'); link.href = url; link.download = `opensideline-${new Date().toISOString().slice(0,10)}.json`; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('Game file exported. Keep youth-player information private.');
}
app.addEventListener('click', event => {
  const trigger = event.target.closest('button[data-action],button[data-result],button[data-command],button[data-tab],button[data-advance]');
  if (!trigger) {
    if (showSetup && event.target.classList.contains('modal-backdrop')) { showSetup = false; render(); }
    return;
  }
  if (trigger.disabled) return;
  if (trigger.dataset.action) return perform({type:trigger.dataset.action});
  if (trigger.dataset.result) return perform({type:'BALL_IN_PLAY',result:trigger.dataset.result});
  if (trigger.dataset.advance) return perform({type:trigger.dataset.kind,from:Number(trigger.dataset.advance)});
  if (trigger.dataset.tab) { selectedTab=trigger.dataset.tab; render(); return; }
  switch (trigger.dataset.command) {
    case 'undo': if (game.events.length) commit(undoEvent(game)); break;
    case 'export': downloadGame(); break;
    case 'open-setup': showSetup = true; render(); break;
    case 'close-setup': showSetup = false; render(); break;
    case 'show-stats': selectedTab = 'stats'; document.querySelector('.timeline-card')?.scrollIntoView({behavior:'smooth'}); render(); break;
    case 'toggle-advanced': showMoreActions = !showMoreActions; render(); break;
  }
});
app.addEventListener('submit', e => {
  if (e.target.id !== 'setup-form') return;
  e.preventDefault();
  if (game.events.length && !confirm('Start a new game? Current plays will be cleared.')) return;
  const form = new FormData(e.target);
  try {
    const next = createGame({ homeName: form.get('homeName'), awayName: form.get('awayName'), homeRoster: parseRoster(form.get('homeRoster'),'home'), awayRoster: parseRoster(form.get('awayRoster'),'away') });
    showSetup=false; selectedTab='plays'; showMoreActions=false;
    commit(next); toast('New game created. Ready for the first pitch.');
  } catch(e) { toast(e.message); }
});
window.addEventListener('storage', e => { if (e.key === STORAGE_KEY) { game = readStoredGame(); render(); } });
channel?.addEventListener('message', e => {
  if (e.data?.from === TAB_ID || !e.data?.game) return;
  try { replayGame(e.data.game); game = e.data.game; render(); } catch { /* discard malformed messages */ }
});
render();

</script>
</body>
</html>
